# ==============================
# DEVELOPMENT CONFIGURATION
# ==============================

server.port=8080

# ==============================
# DATABASE
# ==============================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/talent_recruitment_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:YOUR_DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================
# JPA / HIBERNATE
# ==============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ==============================
# JWT
# ==============================

jwt.secret=${JWT_SECRET:CHANGE_THIS_DEV_JWT_SECRET}
jwt.expiration=86400000

# ==============================
# SWAGGER / OPENAPI
# ==============================

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# ==============================
# LOGGING
# ==============================

logging.level.com.example.talentrecruitment=DEBUG
logging.level.org.springframework.security=INFO
logging.file.name=logs/talent-recruitment.log